{{ define "main" }}
    <section class="profile-section" aria-label="Ambient video">
        <video class="profile-img reveal" data-stagger="0"
               autoplay muted loop playsinline preload="auto"
               aria-hidden="true">
            <source src="/video/leaves-wall.mp4" type="video/mp4">
        </video>
    </section>

    <section class="content-section" aria-labelledby="about-label">
        <div class="section-header">
            <span class="section-label" id="about-label">ABOUT</span>
        </div>
        <div class="bio prose reveal" data-stagger="1">
            <h1 class="home-hero__title">{{ .Site.Title }}</h1>
            <p class="home-subtitle">{{ .Site.Params.homeSubtitle }}</p>
        </div>
        {{- if .Content }}
            <div class="home-bio prose reveal" data-stagger="2">{{ .Content }}</div>
        {{- end }}
    </section>

    <section class="content-section" aria-labelledby="work-label">
        <div class="section-header">
            <span class="section-label" id="work-label">WORK</span>
        </div>
        {{- range .Site.Menus.main }}
            {{- if eq .Identifier "resume" }}
            <p class="home-hero__cta reveal" data-stagger="3">
                <a href="{{ .URL | relLangURL }}" class="cta-resume" rel="noopener">
                    <span>{{ .Name }}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </a>
            </p>
            {{- end }}
        {{- end }}
    </section>

{{ end }}
