<!DOCTYPE html>
<html lang="{{ .Site.Language }}">
<head>
    {{ partial "head.html" . }}
</head>

<body class="mode-night">

<a href="#main" class="skip-link screen-reader-text">Skip to main content</a>

<video id="leaves-overlay" autoplay muted loop playsinline aria-hidden="true">
  <source src="/video/leaves-wall.mp4" type="video/mp4">
</video>

<audio id="forest-audio" muted preload="auto" loop style="display:none">
  <source src="/audio/forest.webm" type="audio/webm">
  <source src="/audio/forest.mp3" type="audio/mpeg">
</audio>

<div class="container">
    {{ partial "header.html" . }}

    <div class="site-grid">
        <aside class="site-col-1">
            {{ partial "col1.html" . }}
        </aside>

        <main class="site-col-2" id="main">
            {{ block "main" . }}{{ end }}
        </main>
    </div>

    {{ partial "footer.html" . }}
</div>

<a href="#" class="back-to-top" aria-label="Back to top">↑</a>

<script src="/js/modes.js" defer></script>
<script src="/js/reveals.js" defer></script>
<script src="/js/leaves.js" defer></script>
<script src="/js/audio.js" defer></script>
<script src="/js/site.js" defer></script>

</body>
</html>
