<div class="col1-close">
    <button type="button" id="col1-close-btn" aria-label="Close navigation">✕ close</button>
</div>

<nav class="site-nav" aria-label="Site navigation">
    {{ partial "menu.html" . }}
</nav>

<div class="col1-social" aria-label="Social links">
    {{- with .Site.Params.social }}
        {{ partial "social-icons.html" . }}
    {{- end }}
</div>

<div class="mode-picker">
    <span class="mode-picker__label" aria-hidden="true">$ mood --set</span>
    <div class="mode-picker__options" role="group" aria-label="Site mood">
        <button type="button" class="mode-picker__button" data-mode="night" aria-label="Night mode" aria-pressed="true">night</button>
        <button type="button" class="mode-picker__button" data-mode="day" aria-label="Day mode" aria-pressed="false">day</button>
        <button type="button" class="mode-picker__button" data-mode="summer" aria-label="Summer mode" aria-pressed="false">summer</button>
    </div>
</div>
