<div class="col1-close">
    <button type="button" id="col1-close-btn" aria-label="Close navigation">✕ close</button>
</div>

<nav class="site-nav" aria-label="Site navigation">
    {{ partial "menu.html" . }}
</nav>

<div class="col1-social" aria-label="Social links">
    {{- with .Site.Params.social }}
        {{ partial "social-icons.html" . }}
    {{- end }}
</div>

<div id="mode-hint" class="mode-hint" role="status" aria-live="polite">
    press D · N · S to shift moods
</div>
